        <section class="wrap page-head">
            <h1>Gallery</h1>
            <p class="lede">Chips, lab setups, and moments from conferences.</p>
        </section>
        <section class="wrap block" aria-labelledby="g-chips">
            <h2 id="g-chips">Chips &amp; lab</h2>
            <div class="tiles">
                <figure class="tile">
                    <a href="assets/gallery/01-automatic-tuning-setup.jpg" target="_blank" rel="noopener">
                        <img src="assets/gallery/01-automatic-tuning-setup.jpg" alt="Automatic tuning setup" loading="lazy" decoding="async">
                    </a>
                    <figcaption>
                        <b>Automatic tuning setup</b>
                        <span>The full bench: heater-control boards, the photonic chip on its carrier, and fiber alignment stages. February 2023.</span>
                    </figcaption>
                </figure>
                <figure class="tile">
                    <a href="assets/gallery/02-heater-control-board.jpg" target="_blank" rel="noopener">
                        <img src="assets/gallery/02-heater-control-board.jpg" alt="Heater-control board" loading="lazy" decoding="async">
                    </a>
                    <figcaption>
                        <b>Heater-control board</b>
                        <span>Multichannel DAC board that drives the on-chip heaters, with the Arduino that runs the tuning loop.</span>
                    </figcaption>
                </figure>
                <figure class="tile">
                    <a href="assets/gallery/03-optical-bench-alignment.jpg" target="_blank" rel="noopener">
                        <img src="assets/gallery/03-optical-bench-alignment.jpg" alt="Fiber alignment on the optical bench" loading="lazy" decoding="async">
                    </a>
                    <figcaption>
                        <b>Fiber alignment on the optical bench</b>
                        <span>Precision stages position fibers over the grating couplers of the photonic chip.</span>
                    </figcaption>
                </figure>
                <figure class="tile">
                    <a href="assets/gallery/04-pic-test-board-probing.jpg" target="_blank" rel="noopener">
                        <img src="assets/gallery/04-pic-test-board-probing.jpg" alt="Photonic chip under test" loading="lazy" decoding="async">
                    </a>
                    <figcaption>
                        <b>Photonic chip under test</b>
                        <span>Silicon photonic chip on its RF test board during probing. July 2022.</span>
                    </figcaption>
                </figure>
                <figure class="tile">
                    <a href="assets/gallery/05-rf-probe-landing.jpg" target="_blank" rel="noopener">
                        <img src="assets/gallery/05-rf-probe-landing.jpg" alt="Landing the probes" loading="lazy" decoding="async">
                    </a>
                    <figcaption>
                        <b>Landing the probes</b>
                        <span>RF probe and fiber array positioned over the chip under the microscope light.</span>
                    </figcaption>
                </figure>
                <figure class="tile">
                    <a href="assets/gallery/06-wire-bonded-pic.jpg" target="_blank" rel="noopener">
                        <img src="assets/gallery/06-wire-bonded-pic.jpg" alt="Wire-bonded photonic chip" loading="lazy" decoding="async">
                    </a>
                    <figcaption>
                        <b>Wire-bonded photonic chip</b>
                        <span>The PIC bonded to the board, with RF connectors on either side.</span>
                    </figcaption>
                </figure>
                <figure class="tile">
                    <a href="assets/gallery/07-chip-under-microscope.jpg" target="_blank" rel="noopener">
                        <img src="assets/gallery/07-chip-under-microscope.jpg" alt="Chip under the microscope" loading="lazy" decoding="async">
                    </a>
                    <figcaption>
                        <b>Chip under the microscope</b>
                        <span>Close-up of the die and its bond pads through the probe-station microscope.</span>
                    </figcaption>
                </figure>
                <figure class="tile">
                    <a href="assets/gallery/08-microscope-camera-view.jpg" target="_blank" rel="noopener">
                        <img src="assets/gallery/08-microscope-camera-view.jpg" alt="Microscope camera view" loading="lazy" decoding="async">
                    </a>
                    <figcaption>
                        <b>Microscope camera view</b>
                        <span>Live camera view of the chip used to align probes during measurement.</span>
                    </figcaption>
                </figure>
                <figure class="tile">
                    <a href="assets/gallery/09-filter-wide-sweep.jpg" target="_blank" rel="noopener">
                        <img src="assets/gallery/09-filter-wide-sweep.jpg" alt="Wide wavelength sweep" loading="lazy" decoding="async">
                    </a>
                    <figcaption>
                        <b>Wide wavelength sweep</b>
                        <span>Measured insertion loss of a ring-resonator filter across a wide sweep, showing the comb of resonances.</span>
                    </figcaption>
                </figure>
                <figure class="tile">
                    <a href="assets/gallery/10-filter-resonances.jpg" target="_blank" rel="noopener">
                        <img src="assets/gallery/10-filter-resonances.jpg" alt="Resonances up close" loading="lazy" decoding="async">
                    </a>
                    <figcaption>
                        <b>Resonances up close</b>
                        <span>A narrower sweep of the same measurement, showing individual resonance dips.</span>
                    </figcaption>
                </figure>
                <figure class="tile">
                    <a href="assets/gallery/11-optical-spectrum-analyzer.jpg" target="_blank" rel="noopener">
                        <img src="assets/gallery/11-optical-spectrum-analyzer.jpg" alt="Optical spectrum check" loading="lazy" decoding="async">
                    </a>
                    <figcaption>
                        <b>Optical spectrum check</b>
                        <span>Checking the optical spectrum on an Anritsu MS9710B during link testing.</span>
                    </figcaption>
                </figure>
            </div>
